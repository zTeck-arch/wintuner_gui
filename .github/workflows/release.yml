name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Gate in front of the release. Until this existed, "Publish release" ran only the build and the
  # static checks: a tag push could publish an artefact for which the 277 unit tests and
  # PSScriptAnalyzer had never run, because their workflow did not trigger on tags at all. That is
  # the cheapest possible way to ship a known-broken release, so it is now impossible - `release`
  # needs this job, and a failure here means no GitHub release is created.
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop

      - name: Install WinTuner module (for the contract test)
        shell: pwsh
        continue-on-error: true
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module WinTuner -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop

      - name: Build single file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'build\Build-SingleFile.ps1')

      - name: Static checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'tests\StaticChecks.ps1')

      - name: Smoke-test the assembled script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'tests\SmokeTest.ps1')

      # Misst die Anordnung im laufenden Fenster: eine Beschriftung, die ueber ihrem Eingabefeld
      # liegt, ist unsichtbar - und weder Parser noch Unit-Test sehen das.
      - name: Layout probe (overlapping controls)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'tests\LayoutProbe.ps1')

      - name: Unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = (Join-Path $env:GITHUB_WORKSPACE 'tests\Unit')
          $config.Run.Throw = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $settings = Join-Path $env:GITHUB_WORKSPACE 'PSScriptAnalyzerSettings.psd1'
          $testSettings = Join-Path $env:GITHUB_WORKSPACE 'PSScriptAnalyzerSettings.Tests.psd1'
          $targets = @(
            Join-Path $env:GITHUB_WORKSPACE 'src'
            Join-Path $env:GITHUB_WORKSPACE 'build'
            Join-Path $env:GITHUB_WORKSPACE 'dev.ps1'
          )
          $findings = @($targets | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Recurse -Settings $settings })
          $findings += @(Invoke-ScriptAnalyzer -Path (Join-Path $env:GITHUB_WORKSPACE 'tests') -Recurse -Settings $testSettings)
          $blocking = @($findings | Where-Object { $_.Severity -in 'Error', 'Warning' })
          foreach ($f in $findings) {
            Write-Host ("[{0}] {1}:{2} {3}" -f $f.Severity, (Split-Path $f.ScriptName -Leaf), $f.Line, $f.RuleName)
          }
          Write-Host ("PSScriptAnalyzer: {0} blocking." -f $blocking.Count)
          if ($blocking.Count -gt 0) { throw "PSScriptAnalyzer reported $($blocking.Count) Error/Warning finding(s); refusing to release." }

  release:
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag and build release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Assemble src/ into the single file that is shipped, then validate that artefact.
          # Building here is what guarantees the release can never contain a stale bundle.
          & (Join-Path $env:GITHUB_WORKSPACE 'build\Build-SingleFile.ps1') -WriteLineMap

          $tag = $env:GITHUB_REF_NAME
          $tagMatch = [regex]::Match($tag, '^v(?<version>\d+\.\d+\.\d+)$')
          if (-not $tagMatch.Success) {
            throw "Release tag must use vMAJOR.MINOR.PATCH, for example v0.13.7. Received: $tag"
          }
          $tagVersion = $tagMatch.Groups['version'].Value
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $source = Join-Path $dist 'WinTuner_GUI_ntg.ps1'
          $content = [IO.File]::ReadAllText($source)
          $versionMatch = [regex]::Match($content, '(?m)^\s*\$script:appVersion\s*=\s*["''](?<version>[^"'']+)["'']\s*$')
          if (-not $versionMatch.Success) { throw 'appVersion was not found in the script.' }
          if ($versionMatch.Groups['version'].Value -ne $tagVersion) {
            throw "Tag $tag does not match appVersion $($versionMatch.Groups['version'].Value)."
          }

          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($source, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error ("{0}:{1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message) }
            throw "PowerShell parser reported $($parseErrors.Count) error(s)."
          }

          # The trailing (?=\r?$) is a LOOKAHEAD on purpose. In multiline mode $ sits before the \n,
          # so with CRLF the \r sits right in front of it: a plain \s*$ matched that \r and consumed
          # it, the replacement put none back, and the line ended in a bare LF. The static checks
          # below run AFTER this patch (since 0.15.4), so they rejected the artefact every time and
          # no release was ever produced. Earlier releases shipped that stray bare LF unnoticed.
          # A lookahead anchors the same place without eating the carriage return.
          $repoPattern = '(?m)^[ \t]*\$script:githubRepo[ \t]*=[ \t]*["''][^"'']*["''][ \t]*(?=\r?$)'
          if (-not [regex]::IsMatch($content, $repoPattern)) { throw 'githubRepo setting was not found.' }
          $replacement = '$script:githubRepo  = "' + $env:GITHUB_REPOSITORY + '"'
          $releaseContent = [regex]::Replace($content, $repoPattern, [Text.RegularExpressions.MatchEvaluator]{ param($match) $replacement })

          # The repository slug is patched into the already-built asset, so the source tree
          # never has to hard-code it and the self-updater still finds this repository.
          $asset = $source
          # UTF-8 *with* BOM on purpose: the prerequisite bootstrap runs under Windows
          # PowerShell 5.1, which decodes BOM-less files using the ANSI code page and would
          # otherwise mangle the German umlauts in its console output.
          [IO.File]::WriteAllText($asset, $releaseContent, [Text.UTF8Encoding]::new($true))

          # The full static checks run HERE, on the patched asset - not before the patch.
          # They used to run on the freshly built file and the repository slug was substituted
          # afterwards, so the artefact that users actually download had never been through them.
          # A parser check alone would not have caught, say, a broken UI key or a lost guard.
          & (Join-Path $env:GITHUB_WORKSPACE 'tests\StaticChecks.ps1') -ScriptPath $asset

          $hash = (Get-FileHash -Path $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashFile = Join-Path $dist 'WinTuner_GUI_ntg.ps1.sha256'
          [IO.File]::WriteAllText($hashFile, "$hash  WinTuner_GUI_ntg.ps1`n", [Text.UTF8Encoding]::new($false))

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            (Join-Path $env:GITHUB_WORKSPACE 'dist\WinTuner_GUI_ntg.ps1') `
            (Join-Path $env:GITHUB_WORKSPACE 'dist\WinTuner_GUI_ntg.ps1.sha256') `
            --title "WinTuner GUI $($env:GITHUB_REF_NAME -replace '^v', '')" `
            --generate-notes `
            --verify-tag
