name: Validate PowerShell

on:
  push:
    branches: [main]
    # Tags too. Pushing a tag is what publishes a release, and until this was here the trigger
    # excluded tags: a tag push ran only "Publish release", which did not run the unit tests or the
    # analyzer. A release could therefore be built and published from a commit for which none of
    # them had ever run.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # In diesem Job wird das WinTuner-Modul ABSICHTLICH nicht installiert: so laufen Smoke-Test und
  # Layout-Probe genau den Weg, den ein Benutzer beim ersten Start ohne Modul nimmt. Dort hing 0.16.0
  # (modaler Dialog im Fehlerzweig des Modul-Imports). Wer hier ein "Install-Module WinTuner"
  # ergaenzt, nimmt diese Abdeckung weg - der Modulvertrag braucht es, dieser Job nicht.
  parser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The parts in src/ are assembled first: the static checks describe the script that
      # users actually download, not the individual fragments.
      - name: Build single file from src/
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'build\Build-SingleFile.ps1')

      - name: Parse WinTuner GUI
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'tests\StaticChecks.ps1')

      # Actually RUNS the assembled script. Everything above this step reads the bundle; nothing
      # executed it, so a part in the wrong order or a $script: variable read before its assignment
      # passed the whole chain and failed on the user's machine instead. The script stops at its own
      # smoke gate before the message loop, so there is no window and nothing to click.
      - name: Smoke-test the assembled script
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'tests\SmokeTest.ps1')

      # Misst die Anordnung im laufenden Fenster: eine Beschriftung, die ueber ihrem Eingabefeld
      # liegt, ist unsichtbar - und weder Parser noch Unit-Test sehen das.
      - name: Layout probe (overlapping controls)
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'tests\LayoutProbe.ps1')

  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop

      # The WinTuner module itself, so ModuleContract.Tests.ps1 actually verifies the contract
      # instead of skipping it. Those assertions are the only thing in the repository that checks the
      # application's assumptions about the module's parameter semantics against the real module -
      # the assumption 0.15.8 got wrong. A skipped contract test is a green tick that proves nothing.
      # Non-fatal on purpose: a PSGallery outage must not turn every build red, and the contract
      # suite reports loudly when it had to skip.
      - name: Install WinTuner module (for the contract test)
        shell: pwsh
        continue-on-error: true
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module WinTuner -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop
          (Get-Module -ListAvailable WinTuner | Sort-Object Version -Descending | Select-Object -First 1).Version.ToString()

      # Behaviour tests for the pure logic - version comparison, version grouping, the installation
      # probe, the performance record, the self-update. They run against src/ directly, so a failure
      # points at the source file rather than at a line in the assembled bundle.
      - name: Run unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -MinimumVersion 5.5.0
          # Die benutzte Pester-Fassung ins Protokoll: der Laeufer installiert immer die neueste aus
          # der Gallery, der Entwicklungsrechner behaelt seine. Eine Discovery, die nur in der CI
          # abbricht ("Container failed"), ist ohne diese Zeile nicht zuzuordnen.
          Write-Host ("Pester {0} on PowerShell {1}" -f (Get-Module Pester).Version, $PSVersionTable.PSVersion)
          $config = New-PesterConfiguration
          $config.Run.Path = (Join-Path $env:GITHUB_WORKSPACE 'tests\Unit')
          $config.Run.Throw = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $settings = Join-Path $env:GITHUB_WORKSPACE 'PSScriptAnalyzerSettings.psd1'
          # Pester needs global stubs to cross its scope boundaries, so tests/Unit runs against a
          # settings file that allows exactly that and keeps every other rule. The application code
          # stays under the stricter set.
          $testSettings = Join-Path $env:GITHUB_WORKSPACE 'PSScriptAnalyzerSettings.Tests.psd1'

          # Analysed per source part, so findings point at the file that has to be edited.
          # dist/ is deliberately not scanned: it is generated and would duplicate every finding.
          $targets = @(
            Join-Path $env:GITHUB_WORKSPACE 'src'
            Join-Path $env:GITHUB_WORKSPACE 'build'
            Join-Path $env:GITHUB_WORKSPACE 'dev.ps1'
          )
          # -Path accepts a single location only, so each target is analysed in turn.
          $findings = @($targets | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_ -Recurse -Settings $settings
          })
          $findings += @(Invoke-ScriptAnalyzer -Path (Join-Path $env:GITHUB_WORKSPACE 'tests') -Recurse -Settings $testSettings)

          # Informational findings are reported but never fail the build.
          $blocking = @($findings | Where-Object { $_.Severity -in 'Error', 'Warning' })
          $info     = @($findings | Where-Object { $_.Severity -eq 'Information' })

          foreach ($f in $findings) {
            $file = Split-Path $f.ScriptName -Leaf
            $level = if ($f.Severity -in 'Error', 'Warning') { 'error' } else { 'notice' }
            Write-Host ("::{0} file={1},line={2}::[{3}] {4}" -f $level, $file, $f.Line, $f.RuleName, $f.Message)
          }

          Write-Host ("PSScriptAnalyzer: {0} blocking, {1} informational." -f $blocking.Count, $info.Count)
          if ($blocking.Count -gt 0) {
            throw "PSScriptAnalyzer reported $($blocking.Count) Error/Warning finding(s)."
          }
